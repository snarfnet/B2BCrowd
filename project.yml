name: B2BCrowd
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.B2BCrowd
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  B2BCrowd:
    type: application
    platform: iOS
    sources: [B2BCrowd]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        INFOPLIST_FILE: B2BCrowd/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: B2BCrowd
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: B2BCrowd/Info.plist
      properties:
        CFBundleName: B2BCrowd
        CFBundleDisplayName: B2B CROWD DUO
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        AudiusAPIKey: "$(AUDIUS_API_KEY)"
        NSAppleMusicUsageDescription: "Apple Music の曲を検索して再生し、B2B 選曲ゲームで使うためにアクセスします。"
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

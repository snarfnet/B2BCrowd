name: TestFlight

# 手動で走らせる（Actions タブの Run workflow、または gh workflow run testflight.yml）
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_[0-9]" | sort -V | tail -1)
        sudo xcode-select -s "/Applications/$XCODE_APP"
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Write Audius API key
      env:
        AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
      run: |
        if [ -n "$AUDIUS_API_KEY" ]; then echo "AUDIUS_API_KEY = $AUDIUS_API_KEY" > Config/Secrets.xcconfig; fi

    - name: Set build number
      run: |
        BUILD_NUM=$(( ${{ github.run_number }} + 1 ))
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i "" "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml
        grep CURRENT_PROJECT_VERSION project.yml

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Set up ASC API key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

    - name: Archive
      run: |
        set -o pipefail
        xcodebuild archive \
          -project B2BCrowd.xcodeproj -scheme B2BCrowd \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath build/B2BCrowd.xcarchive \
          CURRENT_PROJECT_VERSION=${BUILD_NUM} \
          CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=83VGKGSQUH \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec \
          | tee build_archive.log | grep -E "error:|ARCHIVE" || true
        grep -q "ARCHIVE SUCCEEDED" build_archive.log

    - name: Export and upload to App Store Connect
      run: |
        xcodebuild -exportArchive \
          -archivePath build/B2BCrowd.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist export_options.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: archive-log
        path: build_archive.log

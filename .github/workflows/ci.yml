name: Build check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
        sudo xcode-select -s "/Applications/$XCODE_APP"
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Write Audius API key
      env:
        AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
      run: |
        if [ -n "$AUDIUS_API_KEY" ]; then echo "AUDIUS_API_KEY = $AUDIUS_API_KEY" > Config/Secrets.xcconfig; fi

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build for Simulator
      run: |
        set -o pipefail
        xcodebuild build \
          -scheme B2BCrowd \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination "generic/platform=iOS Simulator" \
          -derivedDataPath build/sim \
          CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
        grep -q "BUILD SUCCEEDED" build.log

    - name: Run in Simulator and capture screenshots
      run: |
        set -x
        UDID=$(xcrun simctl list devices available -j | python3 -c "
        import json,sys
        d=json.load(sys.stdin)['devices']
        c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
        print(c[-1]['udid'])")
        xcrun simctl boot "$UDID"
        xcrun simctl bootstatus "$UDID" -b
        APP=build/sim/Build/Products/Debug-iphonesimulator/B2BCrowd.app
        xcrun simctl install "$UDID" "$APP"
        mkdir -p shots
        shot() { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
        run() { xcrun simctl terminate "$UDID" com.tokyonasu.B2BCrowd || true; xcrun simctl launch "$UDID" com.tokyonasu.B2BCrowd -AppleLanguages "(ja)" -shot "$@"; }
        run title; sleep 15; shot 01_title
        run lobby; sleep 3; shot 02a_lobby_3s
        sleep 5; shot 02_lobby
        rec() { xcrun simctl io "$UDID" recordVideo --codec=h264 --force "shots/$1.mp4" & REC=$!; sleep 1; }
        stop() { kill -INT $REC; wait $REC || true; }
        rec 20_lobby_to_session; run lobby; sleep 6
        run session; sleep 5; shot 03_transition
        sleep 8; shot 04_playing
        sleep 20; shot 05_later
        sleep 25; shot 06_hot
        sleep 30; shot 07_hotter; stop
        run session -vjcam; sleep 14; shot 11_vj
        rec 21_booth; run session -boothcam; sleep 12; shot 09_booth_a
        sleep 15; shot 10_booth_b; stop
        run result; sleep 125; shot 08_result
        run split; sleep 20; shot 15_split
        sleep 25; shot 16_split_later
        run audiussearch; sleep 15; shot 13_audius_trending
        rec 22_audius; run audius; sleep 20; shot 12_audius_play
        sleep 30; shot 14_audius_later; stop
        # 2台対戦：同じ Mac のシミュレーター2台でホストとゲストをつなぐ
        UDID2=$(xcrun simctl list devices available -j | python3 -c "
        import json,sys
        d=json.load(sys.stdin)['devices']
        c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and x['udid']!='$UDID']
        print(c[-1]['udid'])")
        xcrun simctl boot "$UDID2" || true
        xcrun simctl bootstatus "$UDID2" -b
        xcrun simctl install "$UDID2" "$APP"
        shot2() { xcrun simctl io "$UDID2" screenshot "shots/$1.png"; }
        xcrun simctl terminate "$UDID" com.tokyonasu.B2BCrowd || true
        xcrun simctl launch "$UDID" com.tokyonasu.B2BCrowd -AppleLanguages "(ja)" -shot linkhost
        sleep 4
        xcrun simctl launch "$UDID2" com.tokyonasu.B2BCrowd -AppleLanguages "(ja)" -shot linkguest
        sleep 12; shot 30_link_host_lobby; shot2 31_link_guest_lobby
        sleep 20; shot 32_link_host_play; shot2 33_link_guest_play
        sleep 30; shot 34_link_host_later; shot2 35_link_guest_later
        sleep 60; shot 36_link_host_end; shot2 37_link_guest_end
        xcrun simctl spawn "$UDID2" log show --last 5m --predicate 'process == "B2BCrowd"' --style compact > shots/app_guest.log 2>&1 || true
        xcrun simctl spawn "$UDID" log show --last 15m --predicate 'process == "B2BCrowd"' --style compact > shots/app.log 2>&1 || true
        mkdir -p shots/crash
        cp ~/Library/Logs/DiagnosticReports/B2BCrowd* shots/crash/ 2>/dev/null || true
        find ~/Library/Logs/DiagnosticReports -name "*B2BCrowd*" -newer build.log -exec cp {} shots/crash/ \; 2>/dev/null || true
        ls shots/crash

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shots
        path: |
          shots/
          !shots/*.mp4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: video
        path: shots/*.mp4
